<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fokus">
<meta name="theme-color" content="#17191C">
<meta name="format-detection" content="telephone=no">

<title>Fokus</title>
<style>
:root{
  --bg:#17191C;--bg2:#1F2226;--bg3:#272B30;--line:#33373D;--tx:#F2EFE9;--tx2:#A9A69F;--tx3:#75736E;
  --ac:#3A9AD9;--acd:#06121B;--warn:#F08A4B;--bad:#E5605A;--ok:#5FBF7F;--wait:#C9A2E8;
  --r:12px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-top:var(--sat);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0;letter-spacing:.06em;text-transform:uppercase;flex:1}
.sync{font-size:12px;color:var(--tx3);display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--ac)}.dot.err{background:var(--bad)}.dot.dirty{background:var(--warn)}
.iconbtn{background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0}
main{padding:12px 16px calc(96px + var(--sab));max-width:1400px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(23,25,28,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--sab))}
nav.tabs button{flex:1;background:none;border:0;color:var(--tx3);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav.tabs button.on{color:var(--ac)}
nav.tabs svg{width:24px;height:24px}
.qa{display:flex;gap:8px;margin-bottom:14px}
.qa input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:16px}
.qa input:focus{outline:none;border-color:var(--ac)}
.btn{background:var(--ac);color:var(--acd);border:0;border-radius:var(--r);padding:11px 16px;font-weight:700}
.btn.sec{background:var(--bg3);color:var(--tx);font-weight:600}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.hint{font-size:12px;color:var(--tx3);margin:-8px 0 14px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--bg3);color:var(--tx2);border-radius:20px;padding:1px 8px;font-size:11px;letter-spacing:0}
h2.warn{color:var(--warn)}h2.bad{color:var(--bad)}
.empty{color:var(--tx3);font-size:13px;padding:8px 2px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.card.drag{opacity:.4}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--tx3);background:none;margin-top:1px;padding:0;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk svg{width:14px;height:14px}
.card .b{flex:1;min-width:0}
.card .t{word-wrap:break-word}
.card.done .t{color:var(--tx3);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12px;color:var(--tx2)}
.tag{border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;background:var(--bg3)}
.due.over{color:var(--bad);font-weight:600}.due.today{color:var(--warn);font-weight:600}
.who{color:var(--wait)}
.banner{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:var(--r);padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.banner .x{flex:1;font-size:14px}
.banner.warn{border-left-color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:600}
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.col{flex:none;width:min(86vw,320px);scroll-snap-align:start;background:#1B1D21;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.col.over{border-color:var(--ac)}
.col h3{margin:2px 2px 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;justify-content:space-between}
@media(min-width:1100px){.board{overflow:visible;margin:0}.col{flex:1;width:auto}}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:16px}
.mrow{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:pointer}
.mrow .t{font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;border-top:4px solid var(--c,var(--ac))}
.pcard .nm{font-weight:700;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:11px;color:var(--tx3)}
.bar{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--c,var(--ac))}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--sab));border-top:1px solid var(--line)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;border:1px solid var(--line)}}
.sheet h3{margin:0 0 12px;font-size:17px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.fld textarea{min-height:90px;resize:vertical}
.fld textarea.big{min-height:40vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px}
.seg button.on{background:var(--ac);color:var(--acd);border-color:var(--ac);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.triage{text-align:center;padding:10px 0}
.triage .big{font-size:20px;font-weight:600;margin:16px 0 8px;word-wrap:break-word}
.triage .seg{justify-content:center;margin-top:16px}
.triage .seg button{padding:12px 14px;font-size:15px}
.small{font-size:12px;color:var(--tx3)}
.setup{max-width:520px;margin:20px auto}
.setup ol{padding-left:20px;color:var(--tx2);font-size:14px}
.setup li{margin-bottom:6px}
a{color:var(--ac)}
.kbd{font-family:ui-monospace,Menlo,monospace;background:var(--bg3);border-radius:5px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<header class="top">
  <h1 id="ttl">Heute</h1>
  <button class="sync" id="syncBtn" title="Jetzt synchronisieren"><span class="dot" id="dot"></span><span id="syncTxt">lokal</span></button>
  <button class="iconbtn" id="setBtn" title="Einstellungen" aria-label="Einstellungen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>Heute</button>
  <button data-v="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Board</button>
  <button data-v="meetings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Meetings</button>
  <button data-v="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7l2-3h5l2 3h9v13H3z"/></svg>Projekte</button>
</nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json" hidden>
<script>
"use strict";
/* ================= Grundlagen ================= */
const APP_VERSION = "1.0.0";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const now = () => new Date().toISOString();
const ts = s => { const v = Date.parse(s || ""); return isNaN(v) ? 0 : v; };
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
function fmtDate(s) {
  if (!s) return "";
  const t = todayISO(), diff = Math.round((new Date(s + "T12:00:00") - new Date(t + "T12:00:00")) / 864e5);
  if (diff === 0) return "heute"; if (diff === 1) return "morgen"; if (diff === -1) return "gestern";
  const d = new Date(s + "T12:00:00");
  const base = WD[d.getDay()] + " " + d.getDate() + "." + (d.getMonth() + 1) + ".";
  if (diff < 0) return base + " (" + (-diff) + " T überfällig)";
  return base;
}
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200); }

/* Status-Spalten */
const COLS = [
  { id: "inbox", name: "Eingang" },
  { id: "now", name: "Fokus heute" },
  { id: "next", name: "Diese Woche" },
  { id: "later", name: "Später" },
  { id: "waiting", name: "Wartet auf" },
  { id: "done", name: "Erledigt" }
];
const COLNAME = Object.fromEntries(COLS.map(c => [c.id, c.name]));
const PALETTE = ["#3A9AD9","#F08A4B","#5FBF7F","#C9A2E8","#E5C35A","#E5605A","#4FC1C1","#D98AB8","#9AA6B2"];

/* ================= Daten ================= */
function emptyData() { return { schema: 1, projects: [], tasks: [], meetings: [], deleted: {} }; }
let D = LS.get("fk_data", null) || emptyData();
let cfg = LS.get("fk_cfg", { owner: "mgtthrdt", repo: "fokus-data", path: "data.json", branch: "main", token: "" });
let sha = LS.get("fk_sha", null);
let dirty = LS.get("fk_dirty", false);
let view = LS.get("fk_view", "today");
let boardFilter = LS.get("fk_filter", "");
let boardSearch = "";
function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  return { schema: 1,
    projects: Array.isArray(d.projects) ? d.projects.filter(x => x && x.id) : [],
    tasks: Array.isArray(d.tasks) ? d.tasks.filter(x => x && x.id) : [],
    meetings: Array.isArray(d.meetings) ? d.meetings.filter(x => x && x.id) : [],
    deleted: d.deleted && typeof d.deleted === "object" ? d.deleted : {} };
}
D = normalize(D);
function saveLocal() { LS.set("fk_data", D); LS.set("fk_dirty", dirty); LS.set("fk_sha", sha); }
function touch(o) { o.updated = now(); return o; }
function changed() { dirty = true; saveLocal(); render(); scheduleSync(); }
const proj = id => D.projects.find(p => p.id === id);
const activeProjects = () => D.projects.filter(p => !p.archived).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.name.localeCompare(b.name));
const openTasks = () => D.tasks.filter(t => t.status !== "done");

function addTask(o) {
  const t = touch(Object.assign({ id: uid("t"), title: "", project: null, status: "inbox", due: null, waitingOn: "", note: "", est: null, meeting: null, created: now(), done: null }, o));
  D.tasks.push(t); return t;
}
function setStatus(t, st) {
  t.status = st;
  t.done = st === "done" ? (t.done || todayISO()) : null;
  touch(t);
}
function removeItem(kind, id) {
  D[kind] = D[kind].filter(x => x.id !== id);
  D.deleted[id] = now();
}

/* ================= Schnelleingabe-Parser ================= */
const WDMAP = { so:0,sonntag:0,mo:1,montag:1,di:2,dienstag:2,mi:3,mittwoch:3,do:4,donnerstag:4,fr:5,freitag:5,sa:6,samstag:6 };
function parseDateWord(w) {
  w = w.toLowerCase().replace(/[,;]$/, "");
  const t = todayISO();
  if (w === "heute") return t;
  if (w === "morgen") return addDays(t, 1);
  if (w === "übermorgen" || w === "uebermorgen") return addDays(t, 2);
  if (w in WDMAP) { const cur = new Date(t + "T12:00:00").getDay(); let d = (WDMAP[w] - cur + 7) % 7; if (d === 0) d = 7; return addDays(t, d); }
  let m = w.match(/^\+(\d+)(t|w)?$/); if (m) return addDays(t, +m[1] * (m[2] === "w" ? 7 : 1));
  m = w.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/);
  if (m) {
    const now_ = new Date(); let y = m[3] ? +m[3] : now_.getFullYear(); if (y < 100) y += 2000;
    const d = new Date(y, +m[2] - 1, +m[1], 12);
    if (isNaN(d) || d.getDate() !== +m[1]) return null;
    let s = iso(d); if (!m[3] && s < t && (new Date(t) - d) > 60 * 864e5) s = iso(new Date(y + 1, +m[2] - 1, +m[1], 12));
    return s;
  }
  m = w.match(/^kw(\d{1,2})$/);
  if (m) { // Freitag der KW (ISO-Woche)
    const y = new Date().getFullYear(), jan4 = new Date(y, 0, 4, 12), mon1 = new Date(jan4); mon1.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7));
    const f = new Date(mon1); f.setDate(mon1.getDate() + (+m[1] - 1) * 7 + 4); let s = iso(f);
    if (s < t) { const j4 = new Date(y + 1, 0, 4, 12), m1 = new Date(j4); m1.setDate(j4.getDate() - ((j4.getDay() + 6) % 7)); f.setTime(m1.getTime()); f.setDate(m1.getDate() + (+m[1] - 1) * 7 + 4); s = iso(f); } return s;
  }
  return null;
}
function findProject(tag) {
  const q = tag.toLowerCase();
  return D.projects.find(p => (p.short || "").toLowerCase() === q) || D.projects.find(p => p.name.toLowerCase() === q)
    || D.projects.find(p => (p.short || "").toLowerCase().startsWith(q) || p.name.toLowerCase().startsWith(q));
}
/* "Text #projekt @person bis fr !"  →  Felder */
function parseQuick(s, defaults) {
  const out = Object.assign({ status: "inbox" }, defaults || {});
  let words = s.trim().split(/\s+/), rest = [];
  for (let i = 0; i < words.length; i++) {
    const w = words[i], lw = w.toLowerCase();
    if (w === "!") { out.status = "now"; continue; }
    if (/^#[\wäöüÄÖÜß\-]+$/.test(w)) {
      const tag = w.slice(1); let p = findProject(tag);
      if (!p) { p = touch({ id: uid("p"), name: tag, short: tag.toLowerCase(), color: PALETTE[D.projects.length % PALETTE.length], archived: false, order: D.projects.length }); D.projects.push(p); }
      out.project = p.id; continue;
    }
    if (/^@[\wäöüÄÖÜß\.\-]+$/.test(w)) { const who = w.slice(1); if (!/^(ich|me|mir)$/i.test(who)) { out.waitingOn = who; out.status = "waiting"; } continue; }
    if ((lw === "bis" || lw === "am" || lw === "fällig") && i + 1 < words.length) { const d = parseDateWord(words[i + 1]); if (d) { out.due = d; i++; continue; } }
    if (/^(heute|morgen|übermorgen)$/.test(lw) || /^\d{1,2}\.\d{1,2}\.(\d{2,4})?$/.test(lw) || /^kw\d{1,2}$/.test(lw) || /^\+\d+[tw]?$/.test(lw)) { const d = parseDateWord(lw); if (d) { out.due = d; continue; } }
    rest.push(w);
  }
  out.title = rest.join(" ").trim();
  if (out.status === "inbox" && out.due && out.due <= addDays(todayISO(), 6) && out.project) out.status = "next";
  return out;
}

/* ================= GitHub-Sync ================= */
const b64enc = s => { const b = new TextEncoder().encode(s); let r = ""; for (let i = 0; i < b.length; i += 0x8000) r += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(r); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const apiUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split("/").map(encodeURIComponent).join("/")}`;
const hdr = () => ({ Authorization: "Bearer " + cfg.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
async function ghGet() {
  const r = await fetch(apiUrl() + "?ref=" + encodeURIComponent(cfg.branch) + "&t=" + Date.now(), { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return null;

  syncing = true; syncErr = ""; updateSyncUI();
  try {
    let okSync = false;
    for (let attempt = 0; attempt < 4; attempt++) {
      const before = serialize(D);
      const remote = await ghGet();
      const merged = normalize(remote ? merge(D, remote.data) : D);
      const needPut = !remote || serialize(merged) !== serialize(remote.data);

}

  if (syncErr) { dot.classList.add("err"); txt.textContent = syncErr === "offline" ? "offline" : "Fehler"; return; }

/* ================= Ansicht: Heute ================= */
function vToday() {

  if (inbox.length) h += `<div class="banner"><div class="x"><b>${inbox.length}</b> unsortiert im Eingang</div><button class="btn sm" data-act="triage">Sortieren</button></div>`;

  if (focus.length > 3) h += `<div class="hint" style="margin-top:0;color:var(--warn)">Mehr als 3 – was davon ist wirklich heute dran?</div>`;

  if (overdue.length) h += `<h2 class="bad">Überfällig <span class="n">${overdue.length}</span></h2>` + list(overdue);

  if (follow.length) h += `<h2>Nachfassen <span class="n">${follow.length}</span></h2>` + list(follow);
  h += `<h2>Diese Woche <span class="n">${week.length}</span></h2>` + list(week, { empty: "Leer." });

}

/* ================= Ansicht: Board ================= */
function vBoard() {
  const q = boardSearch.toLowerCase();
  const match = t => (!boardFilter || t.project === boardFilter) && (!q || (t.title + " " + t.note + " " + t.waitingOn).toLowerCase().includes(q));
  let h = quickBar();
  h += `<div class="chips"><button class="chip ${!boardFilter ? "on" : ""}" data-filter="">Alle</button>${activeProjects().map(p => `<button class="chip ${boardFilter === p.id ? "on" : ""}" data-filter="${esc(p.id)}">${esc(p.short || p.name)}</button>`).join("")}</div>`;

    let arr = D.tasks.filter(t => t.status === c.id && match(t));
    if (c.id === "done") arr = arr.filter(t => !t.done || t.done >= cutoff).sort((a, b) => (b.done || "").localeCompare(a.done || ""));

/* ================= Ansicht: Meetings ================= */

/* ================= Ansicht: Projekte ================= */

$("#main").addEventListener("dragover", e => { const col = e.target.closest(".col"); if (!col) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
$("#main").addEventListener("drop", e => {
  const col = e.target.closest(".col"); if (!col) return; e.preventDefault();
  const t = D.tasks.find(x => x.id === e.dataTransfer.getData("text/plain")); if (!t || t.status === col.dataset.col) return render();
  setStatus(t, col.dataset.col); changed();
});
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("In Zwischenablage kopiert"); }
  catch (e) { openSheet(`<h3>Protokoll</h3><div class="fld"><textarea class="big" readonly>${esc(text)}</textarea></div><div class="acts"><span class="sp"></span><button class="btn" data-close>Schließen</button></div>`); }
}

/* ================= Sheets ================= */
function openSheet(html, onMount) {
  $("#sheet").innerHTML = html; $("#sheetBg").classList.add("open"); document.body.style.overflow = "hidden";
  onMount && onMount($("#sheet"));
}
function closeSheet() { $("#sheetBg").classList.remove("open"); document.body.style.overflow = ""; $("#sheet").innerHTML = ""; render(); }
$("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg" || e.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheetBg").classList.contains("open")) closeSheet();
  if (e.key === "n" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$("#sheetBg").classList.contains("open") && $("#qa")) { e.preventDefault(); $("#qa").focus(); }
});
const projOptions = sel => `<option value="">— kein Projekt —</option>` + activeProjects().concat(D.projects.filter(p => p.archived && p.id === sel)).map(p => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""}>${esc(p.name)}</option>`).join("");

function openTask(id) {
  let t = D.tasks.find(x => x.id === id); if (!t) return;
  const m = t.meeting ? D.meetings.find(x => x.id === t.meeting) : null;
  openSheet(`<h3>Aufgabe</h3>
    <div class="fld"><textarea id="tTitle" rows="2" style="min-height:60px">${esc(t.title)}</textarea></div>
    <div class="fld"><label>Status</label><div class="seg" id="tSt">${COLS.map(c => `<button data-st="${c.id}" class="${t.status === c.id ? "on" : ""}">${c.name}</button>`).join("")}</div></div>
    <div class="row"><div class="fld"><label>Projekt</label><select id="tProj">${projOptions(t.project)}</select></div>
    <div class="fld"><label id="dueLbl">${t.status === "waiting" ? "Nachfassen am" : "Fällig"}</label><input type="date" id="tDue" value="${esc(t.due || "")}"></div></div>
    <div class="row"><div class="fld"><label>Wartet auf / Verantwortlich</label><input id="tWho" value="${esc(t.waitingOn || "")}" placeholder="z. B. Name oder Firma"></div>
    <div class="fld" style="max-width:110px"><label>Aufwand (h)</label><input id="tEst" type="number" inputmode="decimal" step="0.5" min="0" value="${esc(t.est ?? "")}"></div></div>
    <div class="fld"><label>Notiz</label><textarea id="tNote">${esc(t.note || "")}</textarea></div>
    ${m ? `<p class="small">Aus Meeting: <a href="#" data-gomeeting="${esc(m.id)}">${esc(m.title)} (${esc(fmtDate(m.date))})</a></p>` : ""}
    <p class="small">Erstellt ${esc(new Date(t.created || t.updated).toLocaleDateString("de-AT"))}${t.done ? " · erledigt " + esc(new Date(t.done + "T12:00:00").toLocaleDateString("de-AT")) : ""}</p>
    <div class="acts"><button class="btn danger sm" id="tDel">Löschen</button><span class="sp"></span><button class="btn sec" data-close>Abbrechen</button><button class="btn" id="tSave">Speichern</button></div>`,
  s => {
    let st = t.status;
    s.querySelector("#tSt").addEventListener("click", e => { const b = e.target.closest("[data-st]"); if (!b) return; st = b.dataset.st; s.querySelectorAll("#tSt button").forEach(x => x.classList.toggle("on", x === b)); s.querySelector("#dueLbl").textContent = st === "waiting" ? "Nachfassen am" : "Fällig"; });
    s.querySelector("#tSave").addEventListener("click", () => {
      t = D.tasks.find(x => x.id === id); if (!t) { closeSheet(); toast("Aufgabe wurde inzwischen gelöscht"); return; }
      t.title = s.querySelector("#tTitle").value.trim() || t.title; t.project = s.querySelector("#tProj").value || null;
      t.due = s.querySelector("#tDue").value || null; t.waitingOn = s.querySelector("#tWho").value.trim();
      const est = parseFloat(s.querySelector("#tEst").value.replace(",", ".")); t.est = isNaN(est) ? null : est;
      t.note = s.querySelector("#tNote").value;
      if (st !== t.status) setStatus(t, st); else touch(t);
      closeSheet(); changed();
    });
    s.querySelector("#tDel").addEventListener("click", () => { if (confirm("Aufgabe löschen?")) { removeItem("tasks", t.id); closeSheet(); changed(); } });
    const gm = s.querySelector("[data-gomeeting]"); if (gm) gm.addEventListener("click", e => { e.preventDefault(); openMeeting = gm.dataset.gomeeting; closeSheet(); go("meetings"); });
  });
}

function openTriage() {
  const inbox = openTasks().filter(x => x.status === "inbox").sort((a, b) => ts(a.created) - ts(b.created));
  if (!inbox.length) { closeSheet(); toast("Eingang leer ✓"); return; }
  const t = inbox[0];
  openSheet(`<div class="triage"><div class="small">Eingang sortieren · noch ${inbox.length}</div>
    <div class="big">${esc(t.title)}</div><div class="meta" style="justify-content:center">${projTag(t.project)}${dueTag(t)}${t.waitingOn ? `<span class="who">⏳ ${esc(t.waitingOn)}</span>` : ""}</div>
    <div class="fld" style="margin-top:14px;text-align:left"><select id="trProj">${projOptions(t.project)}</select></div>
    <div class="seg" id="trSeg"><button data-st="now">Heute</button><button data-st="next">Diese Woche</button><button data-st="later">Später</button><button data-st="waiting">Wartet auf…</button><button data-st="done">Erledigt</button><button data-st="del" style="color:var(--bad)">Löschen</button></div>
    <div class="acts" style="justify-content:center;margin-top:18px"><button class="btn sec sm" data-close>Pause</button><button class="btn sec sm" id="trEdit">Details…</button></div></div>`,
  s => {
    s.querySelector("#trSeg").addEventListener("click", e => {
      const b = e.target.closest("[data-st]"); if (!b) return;
      const p = s.querySelector("#trProj").value || null;
      if (b.dataset.st === "del") removeItem("tasks", t.id);
      else {
        t.project = p;
        if (b.dataset.st === "waiting" && !t.waitingOn) { const w = prompt("Wartet auf wen?"); if (w) t.waitingOn = w.trim(); }
        setStatus(t, b.dataset.st);
      }
      dirty = true; saveLocal(); scheduleSync(); openTriage();
    });
    s.querySelector("#trEdit").addEventListener("click", () => openTask(t.id));
  });
}

function openMeetingEdit(id) {
  const m = id ? D.meetings.find(x => x.id === id) : null;
  const seriesList = [...new Set(D.meetings.map(x => x.series).filter(Boolean))];
  openSheet(`<h3>${m ? "Meeting bearbeiten" : "Neues Meeting"}</h3>
    <div class="fld"><label>Serie (wiederkehrend – offene Punkte wandern mit)</label><input id="mSeries" list="seriesDl" value="${esc(m?.series || "")}" placeholder="z. B. Jour fixe Technik"><datalist id="seriesDl">${seriesList.map(x => `<option value="${esc(x)}">`).join("")}</datalist></div>
    <div class="fld"><label>Titel</label><input id="mTitle" value="${esc(m?.title || "")}" placeholder="z. B. Meeting #004"></div>
    <div class="row"><div class="fld"><label>Datum</label><input type="date" id="mDate" value="${esc(m?.date || todayISO())}"></div>
    <div class="fld"><label>Projekt</label><select id="mProj">${projOptions(m?.project || boardFilter || null)}</select></div></div>
    <div class="fld"><label>Teilnehmer</label><input id="mAtt" value="${esc(m?.attendees || "")}"></div>
    <div class="acts">${m ? `<button class="btn danger sm" id="mDel">Löschen</button>` : ""}<span class="sp"></span><button class="btn sec" data-close>Abbrechen</button><button class="btn" id="mSave">${m ? "Speichern" : "Anlegen"}</button></div>`,
  s => {
    const ser = s.querySelector("#mSeries");
    ser.addEventListener("change", () => { // Projekt/Teilnehmer vom letzten Termin der Serie übernehmen
      if (m) return; const last = D.meetings.filter(x => x.series === ser.value).sort((a, b) => (b.date || "").localeCompare(a.date || ""))[0];
      if (last) { if (last.project) s.querySelector("#mProj").value = last.project; if (!s.querySelector("#mAtt").value) s.querySelector("#mAtt").value = last.attendees || "";
        const n = D.meetings.filter(x => x.series === ser.value).length + 1; if (!s.querySelector("#mTitle").value) s.querySelector("#mTitle").value = ser.value + " #" + String(n).padStart(3, "0"); }
    });
    s.querySelector("#mSave").addEventListener("click", () => {
      const title = s.querySelector("#mTitle").value.trim() || ser.value.trim() || "Meeting";
      const o = m || { id: uid("m"), created: now(), notes: "" };
      Object.assign(o, { title, series: ser.value.trim(), date: s.querySelector("#mDate").value || todayISO(), project: s.querySelector("#mProj").value || null, attendees: s.querySelector("#mAtt").value.trim() });
      touch(o); if (!m) D.meetings.push(o);
      openMeeting = o.id; closeSheet(); go("meetings"); changed();
    });
    const del = s.querySelector("#mDel");
    if (del) del.addEventListener("click", () => { if (confirm("Meeting löschen? (Aktionen bleiben erhalten)")) { removeItem("meetings", m.id); openMeeting = null; closeSheet(); changed(); } });
  });
}

function openProject(id) {
  const p = id ? D.projects.find(x => x.id === id) : null;
  let color = p?.color || PALETTE[D.projects.length % PALETTE.length];
  openSheet(`<h3>${p ? "Projekt bearbeiten" : "Neues Projekt"}</h3>
    <div class="fld"><label>Name</label><input id="pName" value="${esc(p?.name || "")}" placeholder="z. B. Projekt Nord"></div>
    <div class="fld"><label>Kürzel für #-Eingabe</label><input id="pShort" value="${esc(p?.short || "")}" placeholder="nord" autocapitalize="off"></div>
    <div class="fld"><label>Farbe</label><div class="seg" id="pCol">${PALETTE.map(c => `<button data-c="${c}" style="background:${c};width:34px;height:34px;border-radius:50%;${c === color ? "outline:3px solid #fff;outline-offset:2px" : ""}"></button>`).join("")}</div></div>
    ${p ? `<label class="small"><input type="checkbox" id="pArch" ${p.archived ? "checked" : ""}> Archiviert (abgeschlossen)</label>` : ""}
    <div class="acts" style="margin-top:14px">${p ? `<button class="btn danger sm" id="pDel">Löschen</button>` : ""}<span class="sp"></span><button class="btn sec" data-close>Abbrechen</button><button class="btn" id="pSave">Speichern</button></div>`,
  s => {
    s.querySelector("#pCol").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; color = b.dataset.c; s.querySelectorAll("#pCol button").forEach(x => x.style.outline = x === b ? "3px solid #fff" : "none"); });
    s.querySelector("#pSave").addEventListener("click", () => {
      const name = s.querySelector("#pName").value.trim(); if (!name) return;
      const o = p || { id: uid("p"), order: D.projects.length, archived: false };
      Object.assign(o, { name, short: (s.querySelector("#pShort").value.trim() || name.split(/\s+/)[0]).toLowerCase().replace(/\s+/g, "-"), color });
      if (p) o.archived = s.querySelector("#pArch").checked;
      touch(o); if (!p) D.projects.push(o); closeSheet(); changed();
    });
    const del = s.querySelector("#pDel");
    if (del) del.addEventListener("click", () => { if (confirm("Projekt löschen? Aufgaben bleiben (ohne Projekt).")) { D.tasks.filter(t => t.project === p.id).forEach(t => { t.project = null; touch(t); }); removeItem("projects", p.id); closeSheet(); changed(); } });
  });
}

function openSettings() {
  openSheet(`<h3>Einstellungen</h3>
    <div class="setup" style="margin:0">
    <p class="small">Daten werden als <span class="kbd">data.json</span> in einem <b>privaten</b> GitHub-Repo gespeichert und zwischen allen Geräten synchronisiert. Der Token bleibt nur auf diesem Gerät.</p>
    <div class="row"><div class="fld"><label>Besitzer</label><input id="sOwner" value="${esc(cfg.owner)}" autocapitalize="off"></div><div class="fld"><label>Privates Repo</label><input id="sRepo" value="${esc(cfg.repo)}" autocapitalize="off"></div></div>
    <div class="fld"><label>Token (fine-grained, nur dieses Repo, Contents: Read &amp; write)</label><input id="sTok" type="password" value="${esc(cfg.token)}" placeholder="github_pat_…" autocapitalize="off" autocomplete="off"></div>
    <details class="small" style="margin-bottom:12px"><summary>Token erstellen (2 Minuten)</summary><ol>
      <li>github.com → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token</li>
      <li>Repository access: <b>Only select repositories</b> → <span class="kbd">${esc(cfg.repo)}</span></li>
      <li>Permissions → Repository → <b>Contents: Read and write</b> (sonst nichts)</li>
      <li>Ablauf z. B. 1 Jahr → Generate → hier einfügen</li></ol></details>
    <div class="acts"><button class="btn" id="sSave">Verbinden &amp; sync</button><span class="sp"></span><span class="small" id="sStat">${lastSync ? "Letzter Sync: " + esc(new Date(lastSync).toLocaleString("de-AT")) : ""}${syncErr ? " · " + esc(syncErr) : ""}</span></div>
    <h2>Daten</h2>
    <div class="acts"><button class="btn sec sm" id="sExp">Export JSON</button><button class="btn sec sm" id="sImp">Import JSON</button><button class="btn sec sm" id="sReload">App aktualisieren</button></div>
    <p class="small" style="margin-top:16px">Fokus v${APP_VERSION} · ${D.tasks.length} Aufgaben · ${D.meetings.length} Meetings · ${D.projects.length} Projekte</p>
    <div class="acts"><button class="btn danger sm" id="sForget">Dieses Gerät abmelden</button><span class="sp"></span><button class="btn sec" data-close>Fertig</button></div></div>`,
  s => {
    s.querySelector("#sSave").addEventListener("click", async () => {
      const newCfg = Object.assign({}, cfg, { owner: s.querySelector("#sOwner").value.trim(), repo: s.querySelector("#sRepo").value.trim(), token: s.querySelector("#sTok").value.trim() });
      const repoChanged = newCfg.owner !== cfg.owner || newCfg.repo !== cfg.repo;
      cfg = newCfg; LS.set("fk_cfg", cfg); if (repoChanged) sha = null;
      if (!cfg.token) { s.querySelector("#sStat").textContent = "✗ Kein Token eingetragen"; updateSyncUI(); return; }
      s.querySelector("#sStat").textContent = "verbinde…"; await sync();
      s.querySelector("#sStat").textContent = syncErr ? "✗ " + syncErr : "✓ verbunden";
      if (!syncErr) setTimeout(closeSheet, 700);
    });
    s.querySelector("#sExp").addEventListener("click", () => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([serialize(D)], { type: "application/json" }));
      a.download = "fokus-" + todayISO() + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
    s.querySelector("#sImp").addEventListener("click", () => $("#fileIn").click());
    s.querySelector("#sReload").addEventListener("click", async () => {
      try { const rs = await navigator.serviceWorker?.getRegistrations(); for (const r of rs || []) await r.update(); const ks = await caches.keys(); for (const k of ks) if (k.startsWith("fokus-")) await caches.delete(k); } catch (e) {}
      location.reload();
    });
    s.querySelector("#sForget").addEventListener("click", () => {
      if (!confirm("Token und lokale Kopie auf diesem Gerät löschen? (Daten im GitHub-Repo bleiben.)")) return;
      ["fk_data", "fk_cfg", "fk_sha", "fk_dirty", "fk_last", "fk_view", "fk_filter"].forEach(LS.del); location.reload();
    });
  });
}
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = normalize(JSON.parse(await f.text())); D = merge(d, D); toast("Importiert & zusammengeführt"); closeSheet(); changed(); }
  catch (err) { alert("Datei nicht lesbar: " + err.message); }
  e.target.value = "";
});

/* ================= Start ================= */
window.addEventListener("online", () => scheduleSync(200));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { render(); scheduleSync(100); } });
setInterval(() => { if (document.visibilityState === "visible" && !$("#sheetBg").classList.contains("open")) sync(); }, 3 * 60 * 1000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
if (!cfg.token && !D.tasks.length) openSettings(); else scheduleSync(50);
</script>
</body>
</html>
